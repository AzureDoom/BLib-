import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'com.diffplug.spotless'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    withSourcesJar()
    withJavadocJar()
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    // ⭐ Sep 27 — com.just (just-core, just-codec, just-goap) now comes ONLY from the repository inside this repo, at
    // libs/just-maven. The libraries were handed to the AVP team by their author (bvanseghi) on Sep 26 and just-goap is
    // now our own 0.4.1 build, which exists nowhere else. exclusiveContent means Gradle never asks any other repository
    // for com.just, so the build no longer depends on maven.bvanseghi.dev staying online.
    // ⚠ Sibling repos (avp_alien, avp_human, avp_predator...) resolve com.just TRANSITIVELY through BLib's POM, so they
    // need this same block, pointing at ../blib/libs/just-maven, or they fail with "Could not find com.just:just-goap".
    exclusiveContent {
        forRepository {
            maven {
                name = 'JustLocal'
                url = rootProject.file('libs/just-maven').toURI()
            }
        }
        filter { includeGroup('com.just') }
    }
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven { url = "https://maven.azuredoom.com/mods" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.shedaniel.me" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }
    maven { url = "https://api.modrinth.com/maven" }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version,
                // ⭐⭐ DECLARE WHAT THIS JAR BUNDLES. BLib embeds just-core, just-codec and
                // just-goap via jar-in-jar, and those artifacts are published upstream with an
                // ANONYMOUS manifest — literally only "Manifest-Version: 1.0" — and a POM with no
                // name, licence or scm. Three unidentified jars nested inside a mod is a pattern
                // automated scanners flag as possible obfuscation.
                // <p>
                // ⚠ Read from the SAME properties the jarJar declarations use, so the manifest can
                // never drift from what is actually bundled.
                // </p>
                'Bundled-Dependencies'       : "com.just:just-core:${just_core_version}, " +
                                               "com.just:just-codec:${just_codec_version}, " +
                                               "com.just:just-goap:${just_goap_version}",
                'Bundled-Dependencies-Origin': 'Just-Collective libraries by bvanseghi, maintained by the AVP team since 2026-09-26',
                'Bundled-Dependencies-Notice': 'META-INF/THIRD-PARTY-NOTICES.txt'
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'icon'                         : icon,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)

    doLast {
        def jsonMinifyStart = System.currentTimeMillis()
        def jsonMinified = 0
        def jsonBytesSaved = 0

        fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
            File file = it
            jsonMinified++
            def oldLength = file.length()
            file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
            jsonBytesSaved += oldLength - file.length()
        }

        println('Minified ' + jsonMinified + ' json files. Saved ' + jsonBytesSaved + ' bytes. Took ' + (System.currentTimeMillis() - jsonMinifyStart) + 'ms.')
    }
}

publishing {
    repositories {
        maven {
            name = project.mod_id
            url = uri(project.maven_url)

            credentials(PasswordCredentials) {
                username = findProperty("avpMavenUsername")
                password = findProperty("avpMavenPassword")
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }

    publications {
        maven(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            pom.withXml {
                asNode().dependencies.dependency.each { dep ->
                    if (dep.groupId.text() == 'com.terraformersmc' && dep.artifactId.text() == 'modmenu') {
                        dep.parent().remove(dep)
                    }
                }
            }
        }
    }
}

// Disables Gradle's custom module metadata from being published to maven. The
// metadata includes mapped dependencies which are not reasonably consumable by
// other mod developers.
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    enforceCheck false

    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        leadingTabsToSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}


// ============================================================================================
//  THE BUNDLED com.just JARS CARRY THEIR OWN MANIFESTS NOW (Sep 27)
// ============================================================================================
//  A task here used to rewrite META-INF/MANIFEST.MF inside each nested com.just jar after the
//  build, because upstream published them with an empty manifest and could not be changed.
//  Since Sep 26 the libraries are ours to maintain, so the jars in libs/just-maven were built
//  with complete manifests in the first place and the post-build rewrite is gone. Nothing
//  touches the built BLib jars after jarJar/include any more.
// ============================================================================================
