plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }

    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }

    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Loader projects produce the jars consumed by dependent multi-loader projects. Publish the remapped loader jar to
// Maven Local alongside the shared common artifact so local development can resolve one consistent BLib version.
afterEvaluate {
    def loaderJar = tasks.findByName('remapJar') ?: tasks.named('jar')
    publishing {
        publications {
            loader(MavenPublication) {
                artifactId = base.archivesName.get()
                artifact(loaderJar)
                // Loader projects expose common API types to downstream loader modules. Keep their Maven metadata in
                // sync with the common publication so a locally published BLib is usable by AVP modules at compile
                // time, not only at runtime after jar-in-jar processing.
                pom.withXml {
                    def dependencies = asNode().appendNode('dependencies')
                    [
                        ['just-codec', project.just_codec_version],
                        ['just-core', project.just_core_version],
                        ['just-goap', project.just_goap_version]
                    ].each { dependency ->
                        def node = dependencies.appendNode('dependency')
                        node.appendNode('groupId', 'com.just')
                        node.appendNode('artifactId', dependency[0])
                        node.appendNode('version', dependency[1])
                        node.appendNode('scope', 'compile')
                    }
                }
            }
        }
    }
}

// Oct 23 - [stated] the jars should read "blib-resurrection-..." like the avp mods, e.g.
// build/libs/blib-resurrection-neoforge-1.21.1-0.3.11ac-fork.jar
//
// Only the jar FILE NAMES change. base.archivesName is deliberately left alone: it is the Maven artifactId the avp
// repos resolve BLib by (com.blib:blib-neoforge-1.21.1 and so on), the artifactId of the "loader" publication above,
// and the capabilities the common module publishes - all exactly as before. Maven Local stores the published jar
// under the artifactId, not the file name, so local builds of the avp mods keep finding BLib. The common module's own
// jar is not renamed either.
//
// Covers every jar task in the loader modules (Fabric's remapJar, the plain jar, the source jars). Change the word
// with release_name_tag in gradle.properties.
def releaseNameTag = (project.findProperty('release_name_tag') ?: 'resurrection').toString()

// ⚠ org.gradle.jvm.tasks.Jar, NOT the script's default "Jar" (org.gradle.api.tasks.bundling.Jar). Fabric Loom's
// remapJar and remapSourcesJar extend org.gradle.jvm.tasks.Jar directly, so a plain withType(Jar) matched NeoForge's
// jar and Fabric's dev jar but skipped the finished Fabric jar - the Fabric file kept its old name. The jvm type is the
// parent of both, so this covers every jar task on both loaders.
tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
    archiveBaseName = "${mod_id}-${releaseNameTag}-${project.name}-${minecraft_version}"
}
